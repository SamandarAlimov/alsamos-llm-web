# Alsamos LLM — Nginx reverse proxy (Docker o'rniga to'g'ridan-to'g'ri usul)
# /etc/nginx/sites-available/ai.alsamos.com ga qo'ying, so'ng:
#   sudo ln -s /etc/nginx/sites-available/ai.alsamos.com /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d ai.alsamos.com   # HTTPS uchun
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name ai.alsamos.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / streaming uchun MUHIM:
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
